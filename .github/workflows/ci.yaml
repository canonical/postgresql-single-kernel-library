name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '.jujuignore'
      - 'LICENSE'
      - '**.md'
      - .github/renovate.json5
      - '.github/workflows/sync_docs.yaml'
  schedule:
    - cron: '53 0 * * *'  # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:

jobs:
  lint-workflows:
    name: Lint .github/workflows/
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@v54.0.0
    permissions:
      contents: read
    cache-mode: none

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & uv
        run: |
          pipx install tox
          sudo snap install astral-uv --classic
      - name: tox run -e lint
        run: tox run -e lint
    permissions: {}
    cache-mode: none

  unit-test:
    name: Unit test charm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & uv
        run: |
          pipx install tox
          sudo snap install astral-uv --classic
      - name: Run tests
        run: tox run -e unit
    permissions: {}
    cache-mode: none

  build:
    # The test charms can't use data-platform-workflows build_charm.yaml: scripts/build_charm.sh
    # has to copy the library into them before packing
    strategy:
      fail-fast: false
      matrix:
        substrate:
          - vm
          - k8s
    name: Build ${{ matrix.substrate }} test charm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Same set up as data-platform-workflows build_charm.yaml (v54.0.0)
      - name: Set up environment
        run: |
          sudo snap install lxd
          sudo adduser "$USER" lxd
          # `newgrp` does not work in GitHub Actions; use `sudo --user` instead
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT

          sudo snap install charmcraft --classic
          pipx install poetry
      - run: snap list
      - name: Build test charm
        id: pack
        run: |
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- \
            scripts/build_charm.sh \
            -p ubuntu@24.04:amd64 \
            -c "tests/charms/postgresql_${VAR_SUBSTRATE}_test_charm"
        env:
          VAR_SUBSTRATE: ${{ matrix.substrate }}
      - name: Charmcraft logs
        if: ${{ success() || (failure() && steps.pack.outcome == 'failure') }}
        run: cat ~/.local/state/charmcraft/log/*
      - name: Upload test charm
        uses: actions/upload-artifact@v7
        with:
          name: test-charm-${{ matrix.substrate }}
          path: tests/charms/postgresql_${{ matrix.substrate }}_test_charm/*.charm
          if-no-files-found: error
    outputs:
      artifact-prefix: test-charm
    permissions: {}
    cache-mode: none

  integration-test:
    name: Integration test charm
    needs:
      - lint-workflows
      - lint
      - unit-test
      - build
    uses: $/.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions: {}
    cache-mode: none
