[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.12"
ops = {extras = ["tracing"], version = "^3.9.0"}
boto3 = "^1.43.118"
pgconnstr = "^1.0.1"
requests = "^2.34.2"
tenacity = "^9.2.1"
pydantic = "^2.14.1"
jinja2 = "^3.1.6"
lightkube = "^1.0.1"
lightkube-models = "^1.28.1.4"
psycopg2 = "^2.9.13"
charmlibs-snap = "^1.0.1"
charmlibs-interfaces-tls-certificates = "^1.12.0"
charm-refresh = "^3.1.1.2"
charmlibs-pathops = "^1.3.0"
data-platform-helpers = "^1.1.1"

[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = ">=2.0.0"
# data_platform_libs/v0/upgrade.py
poetry-core = "*"
# data_platform_libs/v0/data_models.py
pydantic = "*"
# COS charm libs vendored inside single_kernel_postgresql (prometheus/loki/
# grafana/certificate_transfer/grafana_agent/rolling_ops): their python deps.
cosl = ">=0.0.53"
# certificate_transfer_interface/v0/certificate_transfer.py
jsonschema = "*"
